<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{ title }} · 仪表盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="detail-page">

<!-- ═══ 顶栏 · 详情页一体化 ═══ -->
<header class="detail-top">
  <div class="header-left">
    <a href="/" class="detail-back" title="返回仪表盘">←</a>
    <div class="detail-title-group">
      <h1 class="detail-title">{{ title }}</h1>
      <p class="detail-subtitle" id="detail-meta"></p>
    </div>
  </div>
  <div class="header-right">
    <span class="config-toggle" onclick="toggleConfig()">⚙ 配置</span>
    <button id="theme-toggle" title="切换主题" onclick="toggleTheme()">
      <span class="icon-sun">☀️</span>
      <span class="icon-moon">🌙</span>
    </button>
  </div>
</header>

<!-- ═══ 配置信息面板 ═══ -->
<div class="config-panel" id="config-panel"></div>

<!-- ═══ 内容区 ═══ -->
<div id="detail-content">
  <div class="skeleton skeleton-num"></div>
  <div class="skeleton skeleton-text"></div>
  <div class="skeleton skeleton-text long"></div>
  <div class="skeleton skeleton-text short"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// 主题
// ═══════════════════════════════════════════════════════════════
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'light' ? null : 'light';
  if (next) html.setAttribute('data-theme', next);
  else html.removeAttribute('data-theme');
  localStorage.setItem('dashboard-theme', next || 'dark');
}
(function() {
  const saved = localStorage.getItem('dashboard-theme');
  if (saved === 'dark') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', 'light');
})();

// ═══════════════════════════════════════════════════════════════
// 模块路由
// ═══════════════════════════════════════════════════════════════
const MODULE = '{{ module }}';
const today = new Date().toISOString().slice(0, 10);

async function init() {
  document.getElementById('detail-meta').textContent = '日期: ' + today;
  renderConfig();
  switch (MODULE) {
    case 'jobs': await loadJobsDetail(); break;
    case 'stocks': await loadStocksDetail(); break;
    case 'wiki': await loadWikiDetail(); break;
    case 'family': await loadFamilyDetail(); break;
    case 'vault': await loadVaultDetail(); break;
  }
}

function toggleConfig() {
  const panel = document.getElementById('config-panel');
  const toggle = document.querySelector('.config-toggle');
  panel.classList.toggle('open');
  toggle.classList.toggle('active');
}

// ═══════════════════════════════════════════════════════════════
// 社招详情
// ═══════════════════════════════════════════════════════════════
async function loadJobsDetail() {
  try {
    const r = await fetch('/api/jobs?date=all').then(r => r.json());
    window._jobsData = r;
    const dates = r.dates || [];
    document.getElementById('detail-meta').textContent =
      `${dates.length} 个日期 · 共 ${r.total || 0} 个岗位`;

    let html = `<div class="fam-filter-bar">
      <span class="fam-filter-label">📅 日期</span>
      <select id="job-date-filter" class="fam-select" onchange="refreshJobTable()" style="min-width:140px;">
        <option value="">全部日期</option>
        ${dates.map(d => `<option value="${d}">${d}</option>`).join('')}
      </select>
      <span class="fam-filter-label" style="margin-left:var(--space-3);">🎯 级别</span>
      <select id="job-tag-filter" class="fam-select" onchange="refreshJobTable()" style="min-width:120px;">
        <option value="">全部级别</option>
        <option value="🔥 高度匹配">🔥 高度匹配</option>
        <option value="⭐ 推荐关注">⭐ 推荐关注</option>
        <option value="💡 可以看看">💡 可以看看</option>
        <option value="📋 一般岗位">📋 一般岗位</option>
      </select>
      <label style="display:flex;align-items:center;gap:4px;margin-left:var(--space-3);font-size:12px;color:var(--fg-secondary);cursor:pointer;">
        <input type="checkbox" id="job-show-skip" onchange="refreshJobTable()"> 显示不考虑
      </label>
      <label style="display:flex;align-items:center;gap:4px;margin-left:var(--space-3);font-size:12px;color:var(--fg-secondary);cursor:pointer;">
        <input type="checkbox" id="job-show-expired" onchange="refreshJobTable()"> 显示已下架
      </label>
      <span id="job-filter-result" class="fam-filter-result" style="margin-left:auto;"></span>
    </div>`;

    html += renderJobTable();
    document.getElementById('detail-content').innerHTML = html;
    // 初始应用过滤（隐藏「不考虑」行等）
    refreshJobTable();
  } catch(e) { console.error(e); }
}

function refreshJobTable() {
  const table = document.querySelector('.job-table-full');
  if (!table) {
    // 表格不存在（异常情况），重新渲染整个区块然后应用过滤
    const container = document.querySelector('#detail-content .detail-card');
    if (container) {
      container.outerHTML = renderJobTable();
    }
    return;
  }
  const showSkip = document.getElementById('job-show-skip')?.checked || false;
  const showExpired = document.getElementById('job-show-expired')?.checked || false;
  const dateVal = document.getElementById('job-date-filter')?.value || '';
  const tagVal = document.getElementById('job-tag-filter')?.value || '';
  let count = 0;
  table.querySelectorAll('tbody tr').forEach(row => {
    const rowStatus = row.dataset.status || '';
    const isSkip = rowStatus === '不考虑';
    const isExpired = rowStatus === '已下架';
    const tag = row.dataset.tag || '';
    const date = row.dataset.date || '';
    let show = true;
    if (!showSkip && isSkip) show = false;
    if (!showExpired && isExpired) show = false;
    if (tagVal && tag !== tagVal) show = false;
    if (dateVal && date !== dateVal) show = false;
    row.style.display = show ? '' : 'none';
    if (show) count++;
  });
  const result = document.getElementById('job-filter-result');
  if (result) result.textContent = count + ' 个岗位';
}

function renderJobTable() {
  const d = window._jobsData;
  if (!d) return '';
  const all = d.by_date || {};

  // 始终渲染全部行（不做任何过滤），过滤由 refreshJobTable() 通过 show/hide 控制
  let rows = [];
  (d.dates || []).forEach(date => {
    (all[date] || []).forEach(j => {
      rows.push({ ...j, _date: date });
    });
  });

  if (rows.length === 0) {
    return '<div class="detail-card"><div class="detail-card-body"><div class="empty-state"><span class="empty-icon">📭</span>暂无岗位数据</div></div></div>';
  }

  // 按日期降序、分数降序
  rows.sort((a, b) => b._date.localeCompare(a._date) || b.score - a.score);

  return `<div class="detail-card" style="overflow-x:auto;">
    <table class="job-table job-table-full">
      <thead><tr>
        <th>日期</th><th>岗位名称</th><th>来源</th><th>匹配分</th><th>级别</th><th>截止</th><th>状态</th>
      </tr></thead>
      <tbody>
      ${rows.map(j => {
        const tagCls = j.tag.includes('🔥') ? 'td-tag-fire' : j.tag.includes('⭐') ? 'td-tag-star' : j.tag.includes('💡') ? 'td-tag-light' : 'td-tag-general';
        const hiddenStatuses = ['不考虑', '已下架'];
        const skipCls = hiddenStatuses.includes(j.status) ? ' job-row-skipped' : '';
        return `<tr class="${skipCls}" id="job-row-${j.id}" data-score="${j.score}" data-tag="${j.tag}" data-date="${j._date}" data-status="${j.status || ''}">
          <td class="text-mono" style="white-space:nowrap;">${j._date}</td>
          <td><a href="${j.link}" target="_blank" rel="noopener">${j.title}</a></td>
          <td>${j.source}</td>
          <td class="text-mono">${j.score}</td>
          <td><span class="td-tag ${tagCls}">${j.tag}</span></td>
          <td style="white-space:nowrap;font-size:11px;">${j.deadline || '-'}</td>
          <td style="white-space:nowrap;">
            <select onchange="setJobStatus('${j.id}', this.value)" class="job-status-select" style="font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid var(--border-default);background:var(--bg-surface);color:var(--fg-primary);">
              <option value="" ${!j.status?'selected':''}>-</option>
              <option value="不考虑" ${j.status==='不考虑'?'selected':''}>不考虑</option>
              <option value="已下架" ${j.status==='已下架'?'selected':''}>已下架</option>
            </select>
          </td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
  </div>`;
}

async function setJobStatus(jobId, status) {
  await fetch(`/api/jobs/${jobId}/status`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({status}),
  });
  // 更新本地数据
  if (window._jobsData) {
    Object.values(window._jobsData.by_date).forEach(arr => {
      arr.forEach(j => { if (j.id === jobId) j.status = status; });
    });
  }
  const row = document.getElementById('job-row-' + jobId);
  if (row) {
    const hiddenStatuses = ['不考虑', '已下架'];
    row.classList.toggle('job-row-skipped', hiddenStatuses.includes(status));
    row.dataset.status = status;
  }
  refreshJobTable();
}

// ═══════════════════════════════════════════════════════════════
// A股详情
// ═══════════════════════════════════════════════════════════════
async function loadStocksDetail() {
  try {
    const [mr, sr, nr, dr, hr] = await Promise.all([
      fetch(`/api/stocks/summary?date=${today}`).then(r => r.json()),
      fetch(`/api/stocks/sectors?date=${today}`).then(r => r.json()),
      fetch(`/api/stocks/northbound?date=${today}`).then(r => r.json()),
      fetch(`/api/stocks/dragon-tiger?date=${today}`).then(r => r.json()),
      fetch(`/api/stocks/hot?date=${today}`).then(r => r.json()),
    ]);

    let html = '';

    // ── 大盘概览 ──
    if (!mr.error && mr.summary) {
      const s = mr.summary;
      html += '<div class="detail-card"><div class="detail-card-header">📈 大盘概览</div><div class="detail-card-body">';
      const total = s.up_count + s.down_count + s.flat_count;
      if (total > 0) {
        const upPct = (s.up_count / total * 100).toFixed(1);
        const downPct = (s.down_count / total * 100).toFixed(1);
        html += `<div class="market-breadth">
          <div class="breadth-bar">
            <div class="breadth-up" style="width:${upPct}%">${s.up_count} ↑</div>
            <div class="breadth-down" style="width:${downPct}%">${s.down_count} ↓</div>
          </div>
          <div class="breadth-info">
            成交 ${s.total_amount_yi}亿 · 涨停 ${s.total_limit_up||0} · 跌停 ${s.total_limit_down||0}
          </div></div>`;
      }
      if (s.indices && s.indices.length > 0) {
        html += '<div class="index-row">';
        s.indices.forEach(idx => {
          const cls = idx.avg_change_pct >= 0 ? 'up' : 'down';
          html += `<div class="index-card ${cls}">
            <div class="index-name">${idx.name}</div>
            <div class="index-chg ${cls}">${idx.avg_change_pct >= 0 ? '+' : ''}${idx.avg_change_pct}%</div>
            <div class="index-sub">涨${idx.up} 跌${idx.down} ${idx.amount_yi}亿</div></div>`;
        });
        html += '</div>';
      }
      html += '</div></div>';
    }

    // ── 行业板块 ──
    if (!sr.error && sr.sectors && sr.sectors.length > 0) {
      html += `<div class="detail-card"><div class="detail-card-header">🏭 行业板块 · 全部 ${sr.sectors.length} 个</div><div class="detail-card-body" style="padding:0;overflow-x:auto;">
        <table class="job-table"><thead><tr><th>#</th><th>行业</th><th>涨跌幅</th><th>成交额</th><th>净流入</th><th>涨/跌</th><th>龙头</th></tr></thead><tbody>`;
      sr.sectors.forEach((s, i) => {
        const cls = s.change_pct >= 0 ? 'up' : 'down';
        html += `<tr>
          <td>${i+1}</td><td style="font-weight:600;">${s.name}</td>
          <td class="${cls}">${s.change_pct >= 0 ? '+' : ''}${s.change_pct}%</td>
          <td>${s.turnover_yi}亿</td><td>${s.net_inflow_yi}亿</td>
          <td>涨${s.up||0}/跌${s.down||0}</td><td>${s.leader||'-'}</td></tr>`;
      });
      html += '</tbody></table></div></div>';
    }

    // ── 北向资金 ──
    if (!nr.error && nr.northbound) {
      const nb = nr.northbound;
      const cls = nb.total_yi >= 0 ? 'up' : 'down';
      html += `<div class="detail-card"><div class="detail-card-header">💰 北向资金</div><div class="detail-card-body">
        <div class="nb-card">
          <div class="nb-total ${cls}">${nb.total_yi >= 0 ? '+' : ''}${nb.total_yi} 亿</div>
          <div class="nb-detail">沪股通 ${nb.hgt_yi}亿 · 深股通 ${nb.sgt_yi}亿</div></div></div></div>`;
    }

    // ── 龙虎榜 ──
    if (!dr.error && dr.dragon_tiger && dr.dragon_tiger.length > 0) {
      html += `<div class="detail-card"><div class="detail-card-header">🐉 龙虎榜 · ${dr.dragon_tiger.length} 条</div><div class="detail-card-body">`;
      dr.dragon_tiger.forEach(dt => {
        const cls = dt.change_pct >= 0 ? 'up' : 'down';
        html += `<div class="dt-item">
          <span class="dt-name">${dt.name}</span><span class="dt-code">${dt.code}</span>
          <span class="dt-pct ${cls}">${dt.change_pct >= 0 ? '+' : ''}${dt.change_pct}%</span>
          <span class="text-mono text-muted">净${dt.net_buy_wan >= 0 ? '+' : ''}${(dt.net_buy_wan/10000).toFixed(2)}亿</span>
          <div class="dt-reason">${dt.reason}</div></div>`;
      });
      html += '</div></div>';
    }

    // ── 强势股 ──
    if (!hr.error && hr.hot_stocks && hr.hot_stocks.length > 0) {
      html += `<div class="detail-card"><div class="detail-card-header">⚡ 强势股 · ${hr.hot_stocks.length} 条</div><div class="detail-card-body">`;
      hr.hot_stocks.forEach(h => {
        const cls = h.change_pct >= 0 ? 'up' : 'down';
        html += `<div class="hot-item">
          <span class="hot-name">${h.name}</span><span class="dt-code">${h.code}</span>
          <span class="hot-pct ${cls}">${h.change_pct >= 0 ? '+' : ''}${h.change_pct}%</span>
          ${h.tags ? `<span class="hot-tags">${h.tags}</span>` : ''}</div>`;
      });
      html += '</div></div>';
    }

    if (!html) {
      html = '<div class="detail-card"><div class="detail-card-body"><div class="empty-state"><span class="empty-icon">📊</span>当日无A股数据</div></div></div>';
    }
    document.getElementById('detail-content').innerHTML = html;
  } catch(e) { console.error(e); }
}

async function loadWikiDetail() {
  try {
    const [br, pr] = await Promise.all([
      fetch('/api/wiki/books').then(r => r.json()),
      fetch('/api/wiki/papers').then(r => r.json()),
    ]);
    const books = br.books || [], papers = pr.papers || [];

    // 加载阅读状态
    let readingStatus = {};
    try { readingStatus = await fetch('/api/reading/status').then(r => r.json()); } catch(e) {}
    window._readingStatus = readingStatus;

    document.getElementById('detail-meta').textContent = `${books.length} 本书 · ${papers.length} 篇论文`;

    let html = '<div class="wiki-split">';

    // ── 左栏：书籍 ──
    html += '<div class="detail-card"><div class="detail-card-header">📖 书籍 · ' + books.length + ' 本</div><div class="detail-card-body">';
    if (books.length > 0) {
      books.forEach((book, i) => {
        const bid = `dbook-${i}`;
        const hasChapters = book.chapters && book.chapters.length > 0;
        const bookKey = '书籍/' + book.name;
        const st = getReadingStatus(bookKey);
        html += `<div class="wiki-book" id="${bid}-container">
          <div class="wiki-book-header" onclick="toggleBookD('${bid}')">
            <span class="reading-dot ${st}" onclick="event.stopPropagation();cycleReading('${bookKey}',this)" title="点击切换已读/未读"></span>
            <span class="wiki-book-name">${book.name}</span>`;
        if (book.notes_html) {
          html += `<a class="wiki-notes-link" href="/wiki/view?path=${encodeURIComponent(book.notes_html)}" target="_blank" onclick="event.stopPropagation()">📝</a>`;
        }
        html += `${hasChapters ? '<span class="wiki-book-arrow">▶</span>' : ''}</div>`;
        if (hasChapters) {
          html += '<div class="wiki-chapters">';
          book.chapters.forEach(ch => {
            html += `<div class="wiki-chapter-item"><a href="/wiki/view?path=${encodeURIComponent(ch.file)}" target="_blank">📄 ${ch.title}</a></div>`;
          });
          html += '</div>';
        }
        html += '</div>';
      });
    } else {
      html += '<div class="empty-state">暂无</div>';
    }
    html += '</div></div>';

    // ── 右栏：论文 ──
    html += '<div class="detail-card"><div class="detail-card-header">📄 论文 · ' + papers.length + ' 篇</div><div class="detail-card-body">';
    if (papers.length > 0) {
      papers.forEach((p, i) => {
        const pid = `dpaper-${i}`;
        const paperKey = '论文/' + p.name;
        const st = getReadingStatus(paperKey);
        html += `<div class="wiki-book" id="${pid}-container">
          <div class="wiki-book-header" onclick="toggleBookD('${pid}')">
            <span class="reading-dot ${st}" onclick="event.stopPropagation();cycleReading('${paperKey}',this)" title="点击切换已读/未读"></span>
            <span class="wiki-book-name">${p.name}</span>`;
        if (p.notes_html) {
          html += `<a class="wiki-notes-link" href="/wiki/view?path=${encodeURIComponent(p.notes_html)}" target="_blank" onclick="event.stopPropagation()">📝</a>`;
        }
        html += '<span class="wiki-book-arrow">▶</span></div>';
        html += '<div class="wiki-chapters">';
        html += `<div class="wiki-chapter-item"><a href="/wiki/view?path=${encodeURIComponent(p.file)}" target="_blank">📄 阅读正文</a></div>`;
        html += '</div></div>';
      });
    } else {
      html += '<div class="empty-state">暂无</div>';
    }
    html += '</div></div>';

    html += '</div>';
    document.getElementById('detail-content').innerHTML = html;
  } catch(e) { console.error(e); }
}

function getReadingStatus(file) {
  const s = (window._readingStatus || {})[file];
  return (s && s.status) || 'unread';
}
async function cycleReading(file, el) {
  const cur = getReadingStatus(file);
  const next = cur === 'finished' ? 'unread' : 'finished';
  await fetch('/api/reading/mark', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: file, status: next }),
  });
  el.className = 'reading-dot ' + next;
  el.title = next === 'finished' ? '已读完' : '未读';
  if (!window._readingStatus) window._readingStatus = {};
  window._readingStatus[file] = { status: next };
}

function toggleBookD(bid) {
  const container = document.getElementById(bid + '-container');
  if (!container) return;
  const isExpanded = container.classList.contains('expanded');
  if (isExpanded) {
    container.classList.remove('expanded');
    const arrow = container.querySelector('.wiki-book-arrow');
    if (arrow) arrow.textContent = '▶';
  } else {
    container.classList.add('expanded');
    const arrow = container.querySelector('.wiki-book-arrow');
    if (arrow) arrow.textContent = '▼';
  }
}

// ═══════════════════════════════════════════════════════════════
// 家庭资料详情（大类 → 子项 → 分类 → 文档 三层结构）
// ═══════════════════════════════════════════════════════════════
let _familyData = {};

// 大类图标和颜色映射
const GROUP_META = {
  '人员': { icon:'👤', color:'var(--accent-3)', bg:'rgba(59,130,246,0.06)' },
  '房产': { icon:'🏠', color:'var(--accent)', bg:'rgba(34,197,94,0.05)' },
  '车辆': { icon:'🚗', color:'var(--accent-2)', bg:'rgba(245,158,11,0.05)' },
};
function groupMeta(group) { return GROUP_META[group] || { icon:'📂', color:'var(--fg-muted)', bg:'var(--bg-surface)' }; }

async function loadFamilyDetail() {
  try {
    const r = await fetch('/api/family/documents').then(r => r.json());
    _familyData = r;
    const gc = r.groups ? r.groups.length : 0;
    document.getElementById('detail-meta').textContent =
      `${gc} 个大类 · ${r.total || 0} 份资料`;

    if (r.is_default) {
      const banner = document.createElement('div');
      banner.className = 'fam-init-banner';
      banner.innerHTML = r.initialized
        ? `⚠️ 数据文件 <code>data/family_docs.json</code> 不存在，已自动创建 <span class="banner-dismiss">✕</span>`
        : `⚠️ 还没有任何资料，点击顶栏 ⚙ 配置 → 📝 编辑 JSON 添加，或通过页面按钮添加 <span class="banner-dismiss">✕</span>`;
      banner.querySelector('.banner-dismiss').addEventListener('click', (e) => { e.stopPropagation(); banner.remove(); });
      banner.addEventListener('click', () => banner.remove());
      document.getElementById('detail-content').before(banner);
    }

    renderFamilyDocs();
  } catch(e) { console.error(e); }
}

function renderFamilyDocs() {
  const d = _familyData;
  let html = '';

  // ── 顶部筛选栏 ──
  html += `<div class="fam-filter-bar">
    <span class="fam-filter-label">🔍 筛选</span>
    <select id="fam-filter-group" class="fam-select" onchange="applyFamilyFilter()" style="min-width:120px;">
      <option value="">全部大类</option>
      ${(d.groups||[]).map(g => `<option value="${escAttr(g)}">${escHtml(g)}</option>`).join('')}
    </select>
    <select id="fam-filter-item" class="fam-select" onchange="applyFamilyFilter()" style="min-width:140px;">
      <option value="">全部子项</option>
    </select>
    <select id="fam-filter-cat" class="fam-select" onchange="applyFamilyFilter()" style="min-width:120px;">
      <option value="">全部分类</option>
      ${(d.categories||[]).map(c => `<option value="${escAttr(c)}">${escHtml(c)}</option>`).join('')}
    </select>
    <span id="fam-filter-result" class="fam-filter-result"></span>
  </div>`;

  if (!d.groups || d.groups.length === 0) {
    html += '<div class="detail-card"><div class="detail-card-body"><div class="empty-state"><span class="empty-icon">📁</span>暂无资料，点击上方按钮添加</div></div></div>';
    document.getElementById('detail-content').innerHTML = html;
    return;
  }

  // ── 大类模块卡片 ──
  html += '<div class="fam-group-grid">';
  d.groups.forEach((group, gi) => {
    const items = (d.items_by_group && d.items_by_group[group]) ? d.items_by_group[group] : [];
    const meta = groupMeta(group);
    // 计算该大类下总文档数
    let groupTotal = 0;
    items.forEach(item => {
      const idocs = (d.documents[group] && d.documents[group][item]) ? d.documents[group][item] : {};
      groupTotal += Object.values(idocs).reduce((s, arr) => s + (Array.isArray(arr)?arr.length:0), 0);
    });

    html += `<div class="fam-module" data-group="${escAttr(group)}" style="--mod-color:${meta.color};--mod-bg:${meta.bg};">
      <div class="fam-module-header">
        <div class="fam-module-title">
          <span class="fam-module-icon">${meta.icon}</span>
          <div class="fam-module-text">
            <span class="fam-module-name">${escHtml(group)}</span>
            <span class="fam-module-stat">${items.length} 个子项 · ${groupTotal} 份资料</span>
          </div>
        </div>
        <div class="fam-module-actions">
          <button class="fam-module-btn" onclick="showFamilyForm(null,'${escAttr(group)}','','')" title="在此大类下添加资料">➕ 添加</button>
          <button class="fam-action-btn fam-edit-btn" onclick="renameFamilyGroup('${escAttr(group)}')" title="重命名">✏️</button>
          <button class="fam-action-btn fam-del-btn" onclick="deleteFamilyGroup('${escAttr(group)}')" title="删除">🗑</button>
        </div>
      </div>
      <div class="fam-module-body">`;

    if (items.length === 0) {
      html += `<div class="fam-empty-module">
        <span class="empty-icon">📭</span><p>暂无子项</p>
        <button class="fam-module-btn" onclick="showFamilyGroupForm()">+ 新增子项</button>
      </div>`;
    } else {
      html += '<div class="fam-item-grid">';
      items.forEach(item => {
        const itemDocs = (d.documents[group] && d.documents[group][item]) ? d.documents[group][item] : {};
        const cats = Object.keys(itemDocs).filter(c => itemDocs[c] && itemDocs[c].length > 0);
        const itemTotal = cats.reduce((s, c) => s + itemDocs[c].length, 0);

        html += `<div class="fam-item-card" data-item="${escAttr(item)}">
          <div class="fam-item-card-header" onclick="this.parentElement.classList.toggle('expanded')" style="cursor:pointer;">
            <span class="fam-item-avatar">${meta.icon}</span>
            <span class="fam-item-card-name">${escHtml(item)}</span>
            <span class="fam-item-card-count">${itemTotal} 份</span>
            <span class="fam-item-expand">▶</span>
            <div class="fam-item-actions" onclick="event.stopPropagation()">
              <button class="fam-action-btn fam-edit-btn" onclick="renameFamilyItem('${escAttr(group)}','${escAttr(item)}')" title="重命名">✏️</button>
              <button class="fam-action-btn fam-del-btn" onclick="deleteFamilyItem('${escAttr(group)}','${escAttr(item)}')" title="删除">🗑</button>
            </div>
          </div>`;

        if (cats.length === 0) {
          html += '<div class="fam-item-card-body" style="display:none;"><div class="empty-state" style="padding:10px;font-size:11px;">暂无资料</div></div>';
        } else {
          const CAT_ORDER = ['身份证', '学历证书', '户口本', '结婚证', '房产证', '护照', '行驶证', '驾驶证'];
          const orderedCats = [...new Set([...CAT_ORDER.filter(c => cats.includes(c)), ...cats.filter(c => !CAT_ORDER.includes(c))])];

          html += '<div class="fam-item-card-body" style="display:none;">';
          orderedCats.forEach(cat => {
            if (!itemDocs[cat] || !itemDocs[cat].length) return;
            const docs = itemDocs[cat];
            html += `<div class="fam-cat-group">
              <div class="fam-cat-header">
                <span>📌 ${escHtml(cat)}</span><span class="fam-cat-num">${docs.length}</span>
                <button class="fam-cat-add-btn" onclick="showFamilyForm(null,'${escAttr(group)}','${escAttr(item)}','${escAttr(cat)}')" title="添加">+</button>
              </div>`;

            docs.forEach(doc => {
              const info = doc._fileInfo;
              const hasPreview = info && info.exists && (info.is_image || info.is_pdf || info.is_md);
              const sizeStr = info && info.size ? formatFileSize(info.size) : '';
              html += `<div class="fam-doc-row" id="fam-doc-${doc.id}" data-category="${escAttr(doc.category)}">
                <span class="fam-doc-icon">${info && info.is_image ? '🖼️' : info && info.is_pdf ? '📕' : info && info.is_md ? '📝' : '📄'}</span>
                <span class="fam-doc-name">${escHtml(doc.name)}</span>
                <span class="fam-doc-path">${escHtml(doc.file_path)}</span>
                ${sizeStr ? `<span class="fam-doc-size">${sizeStr}</span>` : ''}
                ${info && !info.exists ? '<span class="fam-doc-missing">⚠ 文件不存在</span>' : ''}
                <span class="fam-doc-actions">
                  ${hasPreview ? `<button class="fam-action-btn fam-preview-btn" onclick="previewFamilyFile('${escAttr(doc.file_path)}')" title="预览">👁</button>` : ''}
                  <button class="fam-action-btn fam-edit-btn" onclick="showFamilyForm('${doc.id}')" title="编辑">✏️</button>
                  <button class="fam-action-btn fam-del-btn" onclick="deleteFamilyDoc('${doc.id}')" title="删除">🗑</button>
                </span>
              </div>`;
            });

            html += '</div>';
          });

          html += '</div>'; // /fam-item-card-body
        }

        html += '</div>'; // /fam-item-card
      });
      html += '</div>'; // /fam-item-grid
    }

    html += '</div></div>'; // /fam-module-body & /fam-module
  });
  html += '</div>'; // /fam-group-grid

  document.getElementById('detail-content').innerHTML = html;
  loadFamilyFileInfo();
  // 应用当前筛选
  applyFamilyFilter();
}

function applyFamilyFilter() {
  const gFilter = document.getElementById('fam-filter-group');
  const iFilter = document.getElementById('fam-filter-item');
  const catFilter = document.getElementById('fam-filter-cat');
  const groupVal = gFilter ? gFilter.value : '';
  const itemVal = iFilter ? iFilter.value : '';
  const catVal = catFilter ? catFilter.value : '';
  const result = document.getElementById('fam-filter-result');
  const d = _familyData;

  // 更新 item 下拉选项（基于选中的 group）
  if (iFilter && gFilter) {
    const items = groupVal && d.items_by_group && d.items_by_group[groupVal]
      ? d.items_by_group[groupVal] : [];
    const prevItem = iFilter.value;
    iFilter.innerHTML = '<option value="">全部子项</option>' +
      items.map(it => `<option value="${escAttr(it)}" ${it === prevItem ? 'selected' : ''}>${escHtml(it)}</option>`).join('');
  }

  // 统计 & 显示/隐藏
  let totalDocs = 0;
  const allGroups = document.querySelectorAll('.fam-module');
  allGroups.forEach(mod => {
    const gName = mod.dataset.group;
    const showGroup = !groupVal || gName === groupVal;
    mod.style.display = showGroup ? '' : 'none';
    if (!showGroup) return;

    const itemCards = mod.querySelectorAll('.fam-item-card');
    itemCards.forEach(card => {
      const iName = card.dataset.item;
      const showItem = !itemVal || iName === itemVal;
      card.style.display = showItem ? '' : 'none';
      if (!showItem) return;

      // 按分类筛选文档行
      let catMatchCount = 0;
      const docRows = card.querySelectorAll('.fam-doc-row');
      docRows.forEach(row => {
        const catName = row.dataset.category || '';
        const showRow = !catVal || catName === catVal;
        row.style.display = showRow ? '' : 'none';
        if (showRow) catMatchCount++;
      });
      // 没有匹配文档时隐藏整张子项卡片
      if (catVal && catMatchCount === 0 && docRows.length > 0) {
        card.style.display = 'none';
      }
    });

    // 统计
    if (d.documents && d.documents[gName]) {
      const gDocs = d.documents[gName];
      Object.keys(gDocs).forEach(it => {
        if (itemVal && it !== itemVal) return;
        const cats = gDocs[it] || {};
        Object.keys(cats).forEach(cat => {
          if (catVal && cat !== catVal) return;
          const arr = cats[cat];
          if (Array.isArray(arr)) totalDocs += arr.length;
        });
      });
    }
  });

  if (result) {
    const parts = [];
    if (groupVal) parts.push(groupVal);
    if (itemVal) parts.push('→ ' + itemVal);
    if (catVal) parts.push('#' + catVal);
    result.textContent = (parts.length ? parts.join(' ') + ' · ' : '') + totalDocs + ' 份资料';
  }
}

// ── 递归收集所有文档 ──
function collectAllDocs() {
  const docs = [];
  if (_familyData.documents) {
    Object.values(_familyData.documents).forEach(items => {
      if (items && typeof items === 'object') {
        Object.values(items).forEach(cats => {
          if (cats && typeof cats === 'object') {
            Object.values(cats).forEach(arr => {
              if (Array.isArray(arr)) arr.forEach(d => docs.push(d));
            });
          }
        });
      }
    });
  }
  return docs;
}

async function loadFamilyFileInfo() {
  const docs = collectAllDocs();
  const missingCards = new Set();  // 追踪有缺失文件的子项卡片
  for (const doc of docs) {
    try {
      const r = await fetch(`/api/family/preview?path=${encodeURIComponent(doc.file_path)}`).then(r => r.json());
      if (!r.ok || !r.info) continue;
      doc._fileInfo = r.info;
      const el = document.getElementById('fam-doc-' + doc.id);
      if (!el) continue;
      const info = r.info;
      // 图标
      const iconEl = el.querySelector('.fam-doc-icon');
      if (iconEl) iconEl.textContent = info.is_image ? '🖼️' : info.is_pdf ? '📕' : info.is_md ? '📝' : '📄';
      // 文件大小
      let sizeEl = el.querySelector('.fam-doc-size');
      if (info.exists && info.size) {
        if (!sizeEl) {
          sizeEl = document.createElement('span'); sizeEl.className = 'fam-doc-size';
          el.insertBefore(sizeEl, el.querySelector('.fam-doc-actions'));
        }
        sizeEl.textContent = formatFileSize(info.size);
      }
      // 缺失
      let missEl = el.querySelector('.fam-doc-missing');
      if (!info.exists) {
        if (!missEl) {
          missEl = document.createElement('span'); missEl.className = 'fam-doc-missing'; missEl.textContent = '⚠ 文件不存在';
          el.insertBefore(missEl, el.querySelector('.fam-doc-actions'));
        }
        // 标记父级子项卡片
        const card = el.closest('.fam-item-card');
        if (card) missingCards.add(card);
      } else if (missEl) { missEl.remove(); }
      // 预览按钮
      const hasPreview = info.exists && (info.is_image || info.is_pdf || info.is_md);
      const actions = el.querySelector('.fam-doc-actions');
      let previewBtn = actions ? actions.querySelector('.fam-preview-btn') : null;
      if (hasPreview && !previewBtn) {
        previewBtn = document.createElement('button');
        previewBtn.className = 'fam-action-btn fam-preview-btn';
        previewBtn.title = '预览'; previewBtn.textContent = '👁';
        previewBtn.onclick = () => previewFamilyFile(doc.file_path);
        if (actions) actions.insertBefore(previewBtn, actions.firstChild);
      } else if (!hasPreview && previewBtn) { previewBtn.remove(); }
    } catch(e) { /* ignore */ }
  }
  // 对有缺失文件的子项卡片：自动展开 + 头部标记
  missingCards.forEach(card => {
    const count = card.querySelector('.fam-item-card-count');
    if (count && !count.querySelector('.fam-missing-dot')) {
      count.insertAdjacentHTML('beforeend', ' <span class="fam-missing-dot" title="有文件缺失">⚠</span>');
    }
    // 自动展开
    card.classList.add('expanded');
    const body = card.querySelector('.fam-item-card-body');
    if (body) body.style.display = '';
    const arrow = card.querySelector('.fam-item-expand');
    if (arrow) arrow.textContent = '▼';
  });
}

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function escHtml(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ── 通用 Prompt 弹窗（替代原生 prompt）──
function showPrompt(title, placeholder, currentVal, callback) {
  const overlay = document.createElement('div');
  overlay.className = 'fam-modal-overlay'; overlay.id = 'fam-prompt-overlay';
  overlay.innerHTML = `<div class="fam-modal" style="max-width:380px;">
    <div class="fam-modal-header"><span>${title}</span><button class="fam-modal-close" id="fam-prompt-close-btn">✕</button></div>
    <div class="fam-modal-body">
      <input type="text" id="fam-prompt-input" class="fam-prompt-input" placeholder="${escAttr(placeholder)}" value="${escAttr(currentVal)}" autofocus>
    </div>
    <div class="fam-modal-footer">
      <button class="fam-btn-cancel" id="fam-prompt-cancel-btn">取消</button>
      <button class="fam-btn-save" id="fam-prompt-ok">确定</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closePrompt(); });
  document.getElementById('fam-prompt-close-btn').addEventListener('click', closePrompt);
  document.getElementById('fam-prompt-cancel-btn').addEventListener('click', closePrompt);
  const input = document.getElementById('fam-prompt-input');
  input.focus(); input.select();
  document.getElementById('fam-prompt-ok').addEventListener('click', () => {
    const v = input.value.trim();
    closePrompt();
    if (v) callback(v);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('fam-prompt-ok').click(); });
}
function closePrompt() { const o = document.getElementById('fam-prompt-overlay'); if (o) o.remove(); }


// ── 添加/编辑表单弹窗（全部下拉选择）──
// ═══ 表单：子项 + 分类 + 文件地址（group 来自按钮上下文）═══
function showFamilyForm(docId, preGroup, preItem, preCategory) {
  try {
  let doc = null, title = '添加资料';
  if (docId) { doc = collectAllDocs().find(d => d.id === docId); title = '编辑资料'; }

  const gVal = doc ? doc.group : (preGroup || '');
  const itVal = doc ? doc.item : (preItem || '');
  const cVal = doc ? doc.category : (preCategory || '');
  const pVal = doc ? doc.file_path : '';

  const items = (gVal && _familyData.items_by_group && _familyData.items_by_group[gVal])
    ? _familyData.items_by_group[gVal] : [];

  const overlay = document.createElement('div');
  overlay.className = 'fam-modal-overlay'; overlay.id = 'fam-modal-overlay';
  overlay.innerHTML = `<div class="fam-modal" style="max-width:420px;">

function closeFamilyForm() { const o = document.getElementById('fam-modal-overlay'); if (o) o.remove(); }

async function saveFamilyDoc(docId, contextGroup) {
  try {
  const item = document.getElementById('fam-form-item').value.trim();
  const category = document.getElementById('fam-form-category').value.trim();
  const file_path = document.getElementById('fam-form-path').value.trim();

  if (!item) { alert('请选择或输入子项'); return; }
  if (!file_path) { alert('请输入文件地址'); return; }

  const body = { group: contextGroup, item, category, file_path };
  const url = docId ? `/api/family/documents/${docId}` : '/api/family/documents';
  const method = docId ? 'PUT' : 'POST';
  const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }).then(r => r.json());
  if (r.ok) { closeFamilyForm(); await loadFamilyDetail(); }
  else { alert(r.message || '保存失败'); }
  } catch(e) { alert('保存出错: ' + e.message); }
}

async function deleteFamilyDoc(docId) {
  if (!confirm('确定要删除这份资料吗？')) return;
  const r = await fetch(`/api/family/documents/${docId}`, { method: 'DELETE' }).then(r => r.json());
  if (r.ok) await loadFamilyDetail(); else alert(r.message || '删除失败');
}

async function createFamilyGroup() {
  const group = document.getElementById('fam-form-new-group').value.trim();
  const item = document.getElementById('fam-form-new-item').value.trim();
  if (!group) { alert('请选择或输入大类'); return; }
  if (!item) { alert('请输入子项名称'); return; }
  // 不创建占位文档，直接打开添加资料表单（预填大类+子项）
  closeFamilyForm();
  // 先更新本地数据，让表单的下拉能显示新大类/子项
  if (!_familyData.groups) _familyData.groups = [];
  if (!_familyData.groups.includes(group)) _familyData.groups.push(group);
  if (!_familyData.items_by_group) _familyData.items_by_group = {};
  if (!_familyData.items_by_group[group]) _familyData.items_by_group[group] = [];
  if (!_familyData.items_by_group[group].includes(item)) _familyData.items_by_group[group].push(item);
  if (!_familyData.documents) _familyData.documents = {};
  if (!_familyData.documents[group]) _familyData.documents[group] = {};
  if (!_familyData.documents[group][item]) _familyData.documents[group][item] = {};
  showFamilyForm(null, group, item, '');
}

// ── 文件预览弹窗 ──
function previewFamilyFile(filePath) {
  const overlay = document.createElement('div');
  overlay.className = 'fam-modal-overlay'; overlay.id = 'fam-preview-overlay';
  overlay.innerHTML = `<div class="fam-modal fam-preview-modal">
    <div class="fam-modal-header"><span>📄 文件预览</span><div class="fam-modal-header-right"><span id="md-header-actions"></span><button class="fam-modal-close" id="fam-preview-close-btn">✕</button></div></div>
    <div class="fam-preview-body">
      <div class="fam-preview-path">${escHtml(filePath)}</div>
      <div class="fam-preview-content" id="fam-preview-content"><div class="empty-state">加载中...</div></div>
    </div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeFamilyPreview(); });
  document.getElementById('fam-preview-close-btn').addEventListener('click', closeFamilyPreview);
  fetch(`/api/family/preview?path=${encodeURIComponent(filePath)}`).then(r=>r.json()).then(info => {
    if (!info.ok||!info.info||!info.info.exists) {
      document.getElementById('fam-preview-content').innerHTML='<div class="empty-state"><span class="empty-icon">⚠️</span>文件不存在或无法访问</div>'; return;
    }
    const fi=info.info, url=`/api/family/file?path=${encodeURIComponent(filePath)}`;
    if (fi.is_image) document.getElementById('fam-preview-content').innerHTML=`<img src="${url}" class="fam-preview-img" onclick="this.classList.toggle('fam-preview-zoomed')">`;
    else if (fi.is_pdf) document.getElementById('fam-preview-content').innerHTML=`<iframe src="${url}" class="fam-preview-pdf"></iframe>`;
    else if (fi.is_md) renderMdPreview(filePath);
    else document.getElementById('fam-preview-content').innerHTML=`<div class="empty-state"><span class="empty-icon">📄</span><p>无法预览 (${fi.suffix})</p><a href="${url}" target="_blank" class="fam-download-link">⬇ 下载/打开</a></div>`;
  }).catch(()=>{ document.getElementById('fam-preview-content').innerHTML='<div class="empty-state">加载失败</div>'; });
}

function closeFamilyPreview() { const o = document.getElementById('fam-preview-overlay'); if (o) o.remove(); }

// ── Markdown 预览 + 编辑器 ──
let _mdFilePath = '', _mdRaw = '';

function renderMdPreview(filePath) {
  const container = document.getElementById('fam-preview-content');
  container.style.cssText = 'align-items:stretch;justify-content:flex-start;padding:0;';
  container.innerHTML = '<div class="empty-state">加载中...</div>';

  fetch(`/api/family/markdown?path=${encodeURIComponent(filePath)}`)
    .then(r => r.json())
    .then(d => {
      if (!d.ok) { container.innerHTML = `<div class="empty-state"><span class="empty-icon">⚠️</span>${escHtml(d.message||'加载失败')}</div>`; return; }
      _mdFilePath = filePath;
      _mdRaw = d.raw;
      showMdView(d.html);
    })
    .catch(() => { container.innerHTML = '<div class="empty-state">加载失败</div>'; });
}

function showMdView(html) {
  document.getElementById('md-header-actions').innerHTML =
    '<button class="md-header-btn" onclick="showMdEditor()">✏️ 编辑</button>';
  const container = document.getElementById('fam-preview-content');
  container.innerHTML = `<div class="md-preview-area">${html}</div>`;
}

function showMdEditor() {
  document.getElementById('md-header-actions').innerHTML =
    '<button class="md-header-btn md-primary" onclick="saveMdFile()">💾 保存</button>';
  const container = document.getElementById('fam-preview-content');
  container.innerHTML = `<textarea class="md-editor-textarea" id="md-editor-textarea" spellcheck="false">${escHtml(_mdRaw)}</textarea>`;
  const ta = document.getElementById('md-editor-textarea');
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}

async function saveMdFile() {
  const textarea = document.getElementById('md-editor-textarea');
  const content = textarea ? textarea.value : _mdRaw;
  try {
    const r = await fetch('/api/family/markdown', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({path: _mdFilePath, content}),
    }).then(r => r.json());
    if (r.ok) {
      _mdRaw = content;
      renderMdPreview(_mdFilePath);
    } else {
      alert('保存失败: ' + (r.message || '未知错误'));
    }
  } catch(e) { alert('保存出错: ' + e.message); }
}

// ── JSON 配置编辑器 ──
async function showConfigEditor() {
  const overlay = document.createElement('div');
  overlay.className = 'fam-modal-overlay'; overlay.id = 'fam-config-overlay';
  overlay.innerHTML = `<div class="fam-modal" style="max-width:700px;height:80vh;display:flex;flex-direction:column;">
    <div class="fam-modal-header"><span>⚙ 编辑配置 · family_docs.json</span><button class="fam-modal-close" id="fam-config-close-btn">✕</button></div>
    <div class="fam-config-hint">
      文件路径: <code>data/family_docs.json</code> &nbsp;|&nbsp;
      格式: JSON 数组，每条记录 {id, group, item, name, category, file_path, created_at}
    </div>
    <div class="fam-modal-body" style="flex:1;overflow:hidden;padding:0;">
      <textarea id="fam-config-textarea" class="fam-config-textarea" spellcheck="false"></textarea>
    </div>
    <div class="fam-modal-footer">
      <span id="fam-config-status" style="flex:1;font-size:12px;color:var(--fg-muted);"></span>
      <button class="fam-btn-cancel" id="fam-config-cancel-btn">取消</button>
      <button class="fam-btn-save" id="fam-config-save-btn">💾 保存</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeConfigEditor(); });
  document.getElementById('fam-config-close-btn').addEventListener('click', closeConfigEditor);
  document.getElementById('fam-config-cancel-btn').addEventListener('click', closeConfigEditor);

  // 加载当前 JSON
  const textarea = document.getElementById('fam-config-textarea');
  const status = document.getElementById('fam-config-status');
  try {
    const r = await fetch('/api/family/config').then(r => r.json());
    if (r.ok) {
      // 格式化 JSON
      try {
        const parsed = JSON.parse(r.content);
        textarea.value = JSON.stringify(parsed, null, 2);
      } catch(e) { textarea.value = r.content; }
      status.textContent = `已加载，${textarea.value.split('\n').length} 行`;
    } else {
      textarea.value = r.content || '[]';
      status.textContent = '⚠ ' + (r.message || '加载失败');
    }
  } catch(e) {
    textarea.value = '[]';
    status.textContent = '⚠ 加载失败: ' + e.message;
  }

  // 保存
  document.getElementById('fam-config-save-btn').addEventListener('click', async () => {
    const raw = textarea.value;
    try {
      const r = await fetch('/api/family/config', {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({content: raw}),
      }).then(r => r.json());
      if (r.ok) {
        status.textContent = '✅ 已保存 (' + (r.count || 0) + ' 条记录)';
        closeConfigEditor();
        loadFamilyDetail();
      } else {
        status.textContent = '❌ ' + (r.message || '保存失败');
      }
    } catch(e) {
      status.textContent = '❌ 网络错误: ' + e.message;
    }
  });

  // Tab 键支持
  textarea.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = this.selectionStart;
      this.value = this.value.substring(0, start) + '  ' + this.value.substring(this.selectionEnd);
      this.selectionStart = this.selectionEnd = start + 2;
    }
  });
}

function closeConfigEditor() {
  const o = document.getElementById('fam-config-overlay');
  if (o) o.remove();
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeFamilyForm(); closeFamilyPreview(); closePrompt(); closeConfigEditor(); }
});

// ═══════════════════════════════════════════════════════════════
// 密码保险库 — 主密码门 + 密码列表（点击 👁 显示 10 秒）
// ═══════════════════════════════════════════════════════════════
let _vaultTimer = null, _vaultRemaining = 0, _vaultToken = '';

function vaultHeaders() {
  return _vaultToken ? {'Content-Type':'application/json', 'X-Vault-Token': _vaultToken} : {'Content-Type':'application/json'};
}

async function loadVaultDetail() {
  _vaultToken = sessionStorage.getItem('vault_token') || '';
  if (!_vaultToken) {
    renderVaultLock();
    return;
  }
  // 验证 token 是否有效
  const cr = await fetch('/api/vault/check', { headers: vaultHeaders() }).then(r => r.json());
  if (!cr.unlocked) {
    _vaultToken = ''; sessionStorage.removeItem('vault_token');
    renderVaultLock();
    return;
  }
  _vaultRemaining = cr.remaining || 300;
  document.getElementById('detail-meta').textContent = '已解锁';
  await renderVaultItems();
  startVaultTimer();
}

function renderVaultLock() {
  _vaultToken = ''; sessionStorage.removeItem('vault_token');
  if (_vaultTimer) { clearInterval(_vaultTimer); _vaultTimer = null; }
  document.getElementById('detail-meta').textContent = '🔒 已锁定';
  document.getElementById('detail-content').innerHTML = `
    <div class="vault-lock-card">
      <div class="vault-lock-icon">🔐</div>
      <h2>密码保险库</h2>
      <p>请输入主密码解锁</p>
      <div class="vault-lock-form">
        <input type="password" id="vault-pwd-input" placeholder="主密码" autofocus
          onkeydown="if(event.key==='Enter')unlockVault()">
        <button class="fam-btn-save" onclick="unlockVault()">解锁</button>
      </div>
      <div id="vault-lock-msg" style="color:var(--danger);margin-top:8px;font-size:12px;min-height:18px;"></div>
    </div>`;
  document.getElementById('vault-pwd-input').focus();
}

async function unlockVault() {
  const pwd = document.getElementById('vault-pwd-input').value;
  const r = await fetch('/api/vault/unlock', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({password: pwd}),
  }).then(r => r.json());
  if (r.ok && r.token) {
    _vaultToken = r.token;
    sessionStorage.setItem('vault_token', r.token);
    _vaultRemaining = r.timeout || 300;
    await renderVaultItems();
    startVaultTimer();
  } else {
    document.getElementById('vault-lock-msg').textContent = '❌ ' + (r.message || '密码错误');
    document.getElementById('vault-pwd-input').value = '';
    document.getElementById('vault-pwd-input').focus();
  }
}

function startVaultTimer() {
  if (_vaultTimer) clearInterval(_vaultTimer);
  _vaultTimer = setInterval(() => {
    _vaultRemaining--;
    document.getElementById('detail-meta').textContent =
      '已解锁 · ' + Math.floor(_vaultRemaining / 60) + '分' + (_vaultRemaining % 60) + '秒后锁定';
    if (_vaultRemaining <= 0) {
      clearInterval(_vaultTimer); _vaultTimer = null;
      _vaultToken = ''; sessionStorage.removeItem('vault_token');
      document.getElementById('detail-content').innerHTML =
        '<div class="empty-state"><span class="empty-icon">🔒</span>已自动锁定，请刷新页面</div>';
      document.getElementById('detail-meta').textContent = '🔒 已锁定';
    }
  }, 1000);
}

async function renderVaultItems() {
  const r = await fetch('/api/vault/items', { headers: vaultHeaders() }).then(r => r.json());
  // API 返回未解锁 → 回到锁屏
  if (r.ok === false || r.message === '未解锁' || r.message === '未解锁或已超时') {
    clearInterval(_vaultTimer);
    renderVaultLock();
    return;
  }
  const cats = r.categories || [];
  let html = `<div class="fam-filter-bar">
    <span class="fam-filter-label">🔍 筛选</span>
    <select id="vault-filter-cat" class="fam-select" onchange="filterVaultItems()" style="min-width:130px;">
      <option value="">全部分类</option>
      ${cats.map(c => `<option value="${escAttr(c)}">${escHtml(c)}</option>`).join('')}
    </select>
    <button class="fam-add-btn" onclick="showVaultForm()" style="margin-left:auto;padding:6px 16px;font-size:12px;">➕ 添加密码</button>
  </div>`;

  const CAT_ICONS = { '银行卡': '💳', 'WiFi': '📶', 'APP登录': '📱', '网站': '🌐', '其他': '🔑' };
  const CAT_COLORS = { '银行卡': '#f59e0b', 'WiFi': '#22c55e', 'APP登录': '#3b82f6', '网站': '#8b5cf6', '其他': '#64748b' };

  html += '<div class="vault-grid">';

  cats.forEach(cat => {
    const items = (r.items && r.items[cat]) ? r.items[cat] : [];
    if (items.length === 0) return;
    const icon = CAT_ICONS[cat] || '🔑';
    const color = CAT_COLORS[cat] || '#64748b';

    html += `<div class="fam-module vault-module-card" data-cat="${escAttr(cat)}" style="--mod-color:${color};--mod-bg:${color}10;">
      <div class="fam-module-header">
        <div class="fam-module-title">
          <span class="fam-module-icon">${icon}</span>
          <div class="fam-module-text">
            <span class="fam-module-name">${escHtml(cat)}</span>
            <span class="fam-module-stat">${items.length} 条</span>
          </div>
        </div>
      </div>
      <div class="fam-module-body">`;
    items.forEach(item => {
      html += `<div class="vault-item-row" id="vault-${item.id}" data-notes="${escAttr(item.notes||'')}">
        <span class="vault-item-name">${escHtml(item.name)}</span>
        ${item.account ? `<span class="vault-item-account">${escHtml(item.account)}</span>` : ''}
        <span class="vault-item-pwd" id="vault-pwd-${item.id}">****</span>
        <span class="vault-item-actions">
          <button class="fam-action-btn" onclick="toggleVaultPwd('${item.id}')" title="显示/隐藏" style="font-size:16px;">👁</button>
          <button class="fam-action-btn fam-edit-btn" onclick="showVaultForm('${item.id}')">✏️</button>
          <button class="fam-action-btn fam-del-btn" onclick="deleteVaultItem('${item.id}')">🗑</button>
        </span>
      </div>`;
    });
    html += '</div></div>';
  });

  html += '</div>'; // /vault-grid

  if (cats.length === 0) {
    html += '<div class="empty-state"><span class="empty-icon">🔐</span>暂无密码，点击上方按钮添加</div>';
  }

  document.getElementById('detail-content').innerHTML = html;

  // 存原始密码到 dataset
  if (r.items) {
    Object.values(r.items).forEach(arr => arr.forEach(item => {
      const el = document.getElementById('vault-pwd-' + item.id);
      if (el) el.dataset.password = item.password;
    }));
  }
}

function toggleVaultPwd(itemId) {
  const el = document.getElementById('vault-pwd-' + itemId);
  if (!el) return;
  if (el.textContent === '****') {
    el.textContent = el.dataset.password || '';
    el.classList.add('visible');
    // 10 秒后自动遮盖
    clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(() => {
      el.textContent = '****';
      el.classList.remove('visible');
    }, 10000);
  } else {
    el.textContent = '****';
    el.classList.remove('visible');
    clearTimeout(el._hideTimer);
  }
}

function filterVaultItems() {
  const val = document.getElementById('vault-filter-cat').value;
  document.querySelectorAll('.vault-module-card').forEach(b => {
    b.style.display = !val || b.dataset.cat === val ? '' : 'none';
  });
}

function showVaultForm(itemId) {
  let doc = null, title = '添加密码';
  if (itemId) {
    const pwdEl = document.getElementById('vault-pwd-' + itemId);
    const row = document.getElementById('vault-' + itemId);
    const catBlock = row ? row.closest('.vault-module-card') : null;
    doc = {
      id: itemId,
      category: catBlock ? catBlock.dataset.cat : '',
      name: row ? row.querySelector('.vault-item-name').textContent : '',
      account: row ? (row.querySelector('.vault-item-account')?.textContent || '') : '',
      password: pwdEl ? (pwdEl.dataset.password || '') : '',
      notes: row ? (row.dataset.notes || '') : '',
    };
    title = '编辑密码';
  }

  const cats = ['银行卡', 'WiFi', 'APP登录', '网站', '其他'];
  const cVal = doc ? (doc.category || '') : '';
  const nVal = doc ? doc.name : '';
  const aVal = doc ? (doc.account || '') : '';
  const pVal = doc ? (doc.password || '') : '';

  const overlay = document.createElement('div');
  overlay.className = 'fam-modal-overlay'; overlay.id = 'fam-modal-overlay';
  overlay.innerHTML = `<div class="fam-modal" style="max-width:420px;">
    <div class="fam-modal-header"><span>${title}</span><button class="fam-modal-close" id="vault-form-close-btn">✕</button></div>
    <div class="fam-modal-body">
      <div class="fam-form-row">
        <label class="fam-field" style="flex:1"><span>分类</span>
          <input type="text" id="vault-form-cat" placeholder="银行卡 / WiFi / APP登录 / ..." value="${escAttr(cVal)}" list="vault-cat-list" autocomplete="off">
          <datalist id="vault-cat-list">${cats.map(c => `<option value="${c}">`).join('')}</datalist>
        </label>
        <label class="fam-field" style="flex:1"><span>名称 <em>(必填)</em></span>
          <input type="text" id="vault-form-name" placeholder="招行储蓄卡" value="${escAttr(nVal)}"></label>
      </div>
      <div class="fam-form-row">
        <label class="fam-field" style="flex:1"><span>账号</span>
          <input type="text" id="vault-form-account" placeholder="卡号 / 手机号 / 用户名" value="${escAttr(aVal)}"></label>
        <label class="fam-field" style="flex:1"><span>密码 <em>(必填)</em></span>
          <input type="text" id="vault-form-pwd" placeholder="密码" value="${escAttr(pVal)}"></label>
      </div>
      <label class="fam-field"><span>备注</span>
        <input type="text" id="vault-form-notes" placeholder="可选" value="${escAttr(doc ? (doc.notes || '') : '')}"></label>
    </div>
    <div class="fam-modal-footer">
      <button class="fam-btn-cancel" id="vault-cancel-btn">取消</button>
      <button class="fam-btn-save" id="vault-save-btn">保存</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeFamilyForm(); });
  document.getElementById('vault-form-close-btn').addEventListener('click', closeFamilyForm);
  document.getElementById('vault-cancel-btn').addEventListener('click', closeFamilyForm);
  document.getElementById('vault-save-btn').addEventListener('click', () => saveVaultItem(itemId || ''));
  document.getElementById('vault-form-name').focus();
}

async function saveVaultItem(itemId) {
  const category = document.getElementById('vault-form-cat').value.trim();
  const name = document.getElementById('vault-form-name').value.trim();
  const account = document.getElementById('vault-form-account').value.trim();
  const password = document.getElementById('vault-form-pwd').value.trim();
  const notes = document.getElementById('vault-form-notes').value.trim();

  if (!name) { alert('请输入名称'); return; }
  if (!password) { alert('请输入密码'); return; }

  const body = { category, name, account, password, notes };
  const url = itemId ? `/api/vault/items/${itemId}` : '/api/vault/items';
  const method = itemId ? 'PUT' : 'POST';
  const r = await fetch(url, { method, headers: vaultHeaders(), body: JSON.stringify(body) }).then(r => r.json());
  if (r.ok || r.item) {
    closeFamilyForm();
    await renderVaultItems();
  } else {
    alert(r.message || '保存失败');
  }
}

async function deleteVaultItem(itemId) {
  if (!confirm('确定删除这条密码吗？')) return;
  const r = await fetch(`/api/vault/items/${itemId}`, { method: 'DELETE', headers: vaultHeaders() }).then(r => r.json());
  if (r.ok) await renderVaultItems();
  else alert(r.message || '删除失败');
}

init();
</script>
</body>
</html>
